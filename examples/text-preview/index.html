<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ввод сообщения — QA Lab</title><link rel="stylesheet" href="style.css"><script src="preview.js" defer></script></head>
<body><main><header>Publisher QA Lab · Демостенд</header><p>01 / Ввод</p><h1>Тестовое сообщение</h1><p>Введите вымышленный текст. Следующая страница покажет его в этой же вкладке. Не вводите личные данные.</p><form id="entry" autocomplete="off"><label for="message">Ваш текст (до 2000 символов)</label><textarea id="message" rows="5" maxlength="2000" required></textarea><button type="submit" disabled>Показать результат →</button></form><noscript>Для локального предпросмотра включите JavaScript.</noscript><p id="notice" role="status"></p><footer>Текст не отправляется на сервер и не добавляется в ссылку.</footer></main></body></html>
